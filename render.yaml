# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: inventario-foto-pwa
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-db
          property: connectionString

databases:
  - name: inventario-db
    plan: free
